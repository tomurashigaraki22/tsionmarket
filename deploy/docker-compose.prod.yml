# Production stack for api.tsionmarket.com
#
#   caddy  :80/:443  -> automatic Let's Encrypt TLS, proxies to api:3456
#   api    :3456     -> internal + 127.0.0.1 only (never published publicly)
#   mysql            -> internal only, no published port at all
#
# Start with ../deploy.sh — it generates secrets, migrates, then boots.

name: tsionmarket

services:
  mysql:
    image: mysql:8.4.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-tsionmarket}
      MYSQL_USER: ${MYSQL_USER:-tsionmarket_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD}
      # Consumed by mysql-init/01-create-migration-user.sh on first boot.
      MYSQL_MIGRATION_USER: ${MYSQL_MIGRATION_USER:-tsionmarket_migrator}
      MYSQL_MIGRATION_PASSWORD: ${MYSQL_MIGRATION_PASSWORD:?set MYSQL_MIGRATION_PASSWORD}
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
      - --sql-mode=STRICT_TRANS_TABLES,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION
    # No `ports:` on purpose — the database is reachable only on the Compose
    # network. Use `docker compose exec mysql mysql ...` for admin access.
    volumes:
      - tsionmarket_mysql_data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent',
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  migrate:
    build:
      context: ..
      target: runtime
    environment: &app-environment
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3456
      # Caddy is exactly one hop in front of the API.
      TRUST_PROXY_HOPS: 1
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?set CORS_ALLOWED_ORIGINS}
      JSON_BODY_LIMIT: 256kb
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-120}
      AUTH_BYPASS_ENABLED: 'false'

      AUTH_ACCESS_TOKEN_SECRET: ${AUTH_ACCESS_TOKEN_SECRET:?set AUTH_ACCESS_TOKEN_SECRET}
      AUTH_ACCESS_TOKEN_KID: ${AUTH_ACCESS_TOKEN_KID:-primary}
      AUTH_TOKEN_ISSUER: ${AUTH_TOKEN_ISSUER:-tsionmarket-backend}
      AUTH_TOKEN_AUDIENCE: ${AUTH_TOKEN_AUDIENCE:-tsionmarket-client}
      AUTH_ACCESS_TOKEN_TTL_SECONDS: ${AUTH_ACCESS_TOKEN_TTL_SECONDS:-900}
      AUTH_REFRESH_TOKEN_PEPPER: ${AUTH_REFRESH_TOKEN_PEPPER:?set AUTH_REFRESH_TOKEN_PEPPER}
      AUTH_PASSWORD_PEPPER: ${AUTH_PASSWORD_PEPPER:?set AUTH_PASSWORD_PEPPER}
      AUTH_CHALLENGE_PEPPER: ${AUTH_CHALLENGE_PEPPER:?set AUTH_CHALLENGE_PEPPER}
      AUTH_REFRESH_IDLE_TTL_SECONDS: ${AUTH_REFRESH_IDLE_TTL_SECONDS:-2592000}
      AUTH_REFRESH_ABSOLUTE_TTL_SECONDS: ${AUTH_REFRESH_ABSOLUTE_TTL_SECONDS:-7776000}
      AUTH_VERIFICATION_TTL_SECONDS: ${AUTH_VERIFICATION_TTL_SECONDS:-3600}
      AUTH_RESET_TTL_SECONDS: ${AUTH_RESET_TTL_SECONDS:-1800}
      AUTH_MAX_LOGIN_FAILURES: ${AUTH_MAX_LOGIN_FAILURES:-5}
      AUTH_LOCKOUT_SECONDS: ${AUTH_LOCKOUT_SECONDS:-900}
      AUTH_CLEANUP_INTERVAL_SECONDS: ${AUTH_CLEANUP_INTERVAL_SECONDS:-3600}
      AUTH_TERMS_VERSION: ${AUTH_TERMS_VERSION:-2026-09-22}
      AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME:-tsion_refresh}
      AUTH_CSRF_COOKIE_NAME: ${AUTH_CSRF_COOKIE_NAME:-tsion_csrf}
      # Production refuses console delivery. Default is Hostinger SMTP.
      AUTH_EMAIL_DELIVERY_MODE: ${AUTH_EMAIL_DELIVERY_MODE:-smtp}
      AUTH_SMTP_HOST: ${AUTH_SMTP_HOST:-smtp.hostinger.com}
      AUTH_SMTP_PORT: ${AUTH_SMTP_PORT:-465}
      AUTH_SMTP_SECURE: ${AUTH_SMTP_SECURE:-true}
      AUTH_SMTP_USER: ${AUTH_SMTP_USER:?set AUTH_SMTP_USER}
      AUTH_SMTP_PASSWORD: ${AUTH_SMTP_PASSWORD:?set AUTH_SMTP_PASSWORD}
      AUTH_EMAIL_FROM: ${AUTH_EMAIL_FROM:?set AUTH_EMAIL_FROM}
      AUTH_EMAIL_LINK_BASE_URL: ${AUTH_EMAIL_LINK_BASE_URL:?set AUTH_EMAIL_LINK_BASE_URL}
      # Only used when AUTH_EMAIL_DELIVERY_MODE=http.
      AUTH_EMAIL_PROVIDER_URL: ${AUTH_EMAIL_PROVIDER_URL:-}
      AUTH_EMAIL_PROVIDER_API_KEY: ${AUTH_EMAIL_PROVIDER_API_KEY:-}

      NETWORK_MODE: ${NETWORK_MODE:-production}
      ETHEREUM_RPC_URLS: ${ETHEREUM_RPC_URLS:-}
      ETHEREUM_RPC_URL: ${ETHEREUM_RPC_URL:-}
      ETHEREUM_FALLBACK_RPC_URL: ${ETHEREUM_FALLBACK_RPC_URL:-}
      ARBITRUM_RPC_URLS: ${ARBITRUM_RPC_URLS:-}
      ARBITRUM_RPC_URL: ${ARBITRUM_RPC_URL:-}
      ARBITRUM_FALLBACK_RPC_URL: ${ARBITRUM_FALLBACK_RPC_URL:-}
      SOLANA_MAINNET_RPC_URLS: ${SOLANA_MAINNET_RPC_URLS:-}
      SOLANA_MAINNET_RPC_URL: ${SOLANA_MAINNET_RPC_URL:-}
      SOLANA_RPC_URL: ${SOLANA_RPC_URL:-}
      SOLANA_FALLBACK_RPC_URL: ${SOLANA_FALLBACK_RPC_URL:-}
      RPC_TIMEOUT_MS: ${RPC_TIMEOUT_MS:-8000}
      RPC_MAX_RETRIES: ${RPC_MAX_RETRIES:-1}
      RPC_PROVIDER_COOLDOWN_MS: ${RPC_PROVIDER_COOLDOWN_MS:-30000}

      BALANCE_CACHE_TTL_MS: ${BALANCE_CACHE_TTL_MS:-15000}
      BALANCE_AGGREGATE_TIMEOUT_MS: ${BALANCE_AGGREGATE_TIMEOUT_MS:-12000}
      BALANCE_MAX_CONCURRENCY: ${BALANCE_MAX_CONCURRENCY:-5}
      SPOT_MARKET_REGISTRY_ENABLED: ${SPOT_MARKET_REGISTRY_ENABLED:-false}
      SPOT_MARKET_REGISTRY_START_DELAY_SECONDS: ${SPOT_MARKET_REGISTRY_START_DELAY_SECONDS:-15}
      SPOT_MARKET_REGISTRY_INTERVAL_SECONDS: ${SPOT_MARKET_REGISTRY_INTERVAL_SECONDS:-900}
      SPOT_MARKET_REGISTRY_MAX_TOKENS_PER_ROUTE: ${SPOT_MARKET_REGISTRY_MAX_TOKENS_PER_ROUTE:-500}
      MARKET_STALE_AFTER_SECONDS: ${MARKET_STALE_AFTER_SECONDS:-1800}

      LIFI_API_URL: ${LIFI_API_URL:-https://li.quest/v1}
      LIFI_API_KEY: ${LIFI_API_KEY:-}
      LIFI_INTEGRATOR: ${LIFI_INTEGRATOR:-tewa}
      LIFI_QUOTE_TIMEOUT_MS: ${LIFI_QUOTE_TIMEOUT_MS:-15000}
      SWAP_QUOTE_TTL_SECONDS: ${SWAP_QUOTE_TTL_SECONDS:-60}
      TRANSACTION_INTENT_TTL_SECONDS: ${TRANSACTION_INTENT_TTL_SECONDS:-300}
      MAX_SLIPPAGE_BPS: ${MAX_SLIPPAGE_BPS:-500}
      FEE_SAFETY_BUFFER_BPS: ${FEE_SAFETY_BUFFER_BPS:-2000}
      SUBMISSION_MAX_BYTES: ${SUBMISSION_MAX_BYTES:-200000}
      TRANSACTION_RECONCILE_INTERVAL_SECONDS: ${TRANSACTION_RECONCILE_INTERVAL_SECONDS:-30}
      TRANSACTION_RECONCILE_BATCH_SIZE: ${TRANSACTION_RECONCILE_BATCH_SIZE:-100}
      TRANSACTION_RECONCILE_MAX_ATTEMPTS: ${TRANSACTION_RECONCILE_MAX_ATTEMPTS:-20}

      METRICS_ENABLED: ${METRICS_ENABLED:-true}
      METRICS_BEARER_TOKEN: ${METRICS_BEARER_TOKEN:?set METRICS_BEARER_TOKEN}

      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-tsionmarket}
      MYSQL_USER: ${MYSQL_USER:-tsionmarket_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD}
      MYSQL_CONNECTION_LIMIT: ${MYSQL_CONNECTION_LIMIT:-10}
      MYSQL_QUEUE_LIMIT: ${MYSQL_QUEUE_LIMIT:-100}
      MYSQL_CONNECT_TIMEOUT_MS: ${MYSQL_CONNECT_TIMEOUT_MS:-10000}
      MYSQL_ACQUIRE_TIMEOUT_MS: ${MYSQL_ACQUIRE_TIMEOUT_MS:-10000}
      MYSQL_QUERY_TIMEOUT_MS: ${MYSQL_QUERY_TIMEOUT_MS:-10000}
      MYSQL_MIGRATION_USER: ${MYSQL_MIGRATION_USER:-tsionmarket_migrator}
      MYSQL_MIGRATION_PASSWORD: ${MYSQL_MIGRATION_PASSWORD:?set MYSQL_MIGRATION_PASSWORD}
      MYSQL_MIGRATION_LOCK_TIMEOUT_SECONDS: ${MYSQL_MIGRATION_LOCK_TIMEOUT_SECONDS:-30}
    depends_on:
      mysql:
        condition: service_healthy
    command: ['node', 'dist/db/migrate.js']
    restart: 'no'

  api:
    build:
      context: ..
      target: runtime
    restart: unless-stopped
    environment: *app-environment
    # Loopback only. Public traffic arrives through Caddy over TLS.
    ports:
      - '127.0.0.1:${API_LOCAL_PORT:-3456}:3456'
    depends_on:
      mysql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3456/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      API_DOMAIN: ${API_DOMAIN:-api.tsionmarket.com}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy

volumes:
  tsionmarket_mysql_data:
  caddy_data:
  caddy_config:
